[project]
name = "mfa-auth-app"
version = "1.0.0"
description = "Secure Flask authentication application with TOTP multi-factor authentication"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask==3.0.3",
    "Flask-Limiter==3.8.0",
    "Flask-WTF==1.2.1",
    "Flask-SQLAlchemy==3.1.1",
    "email-validator==2.2.0",
    "pyotp==2.9.0",
    "qrcode==7.4.2",
    "cryptography==43.0.1",
    "gunicorn==22.0.0",
    "python-dotenv==1.0.1",
]

[tool.vercel]
entrypoint = "run:app"
